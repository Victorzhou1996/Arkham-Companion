# Reference fragment for the outer Arkham server block, before generic image regexes.
# Confirm the native frontend port and an existing arkham_static cache zone first.
# The native resolver applies: user cards -> English fallback -> bundled images.
location ~ ^/img/arkham/(?:zh/)?cards/ {
    proxy_pass http://127.0.0.1:39180;
    proxy_set_header Host $http_host;
    proxy_cache arkham_static;
    proxy_cache_key "$scheme$proxy_host$request_uri:card-pack-20260913";
    proxy_cache_valid 200 30d;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
}
