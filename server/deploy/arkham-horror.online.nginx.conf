map $http_upgrade $arkham_connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name arkham-horror.online www.arkham-horror.online 124.221.195.194 _;

    client_max_body_size 1g;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /api/v1/password-reset {
        proxy_pass http://127.0.0.1:39103;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/v1/register {
        proxy_pass http://127.0.0.1:39103;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/v1/register/verify {
        proxy_pass http://127.0.0.1:39103;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/v1/arkham/public-stats {
        proxy_pass http://127.0.0.1:39103;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/v1/arkham/games {
        proxy_pass http://127.0.0.1:39103;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/v1/arkham/games/import {
        proxy_pass http://127.0.0.1:39103;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/v1/arkham/bugs(?:/.*)?$ {
        proxy_pass http://127.0.0.1:39103;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/v1/arkham/games/[0-9a-fA-F-]+/(archive|archive-status|full-export|join|claim-seat|file-bug)$ {
        proxy_pass http://127.0.0.1:39103;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /build-api/ {
        proxy_pass https://api.arkham.build/;
        proxy_ssl_server_name on;
        proxy_ssl_name api.arkham.build;
        proxy_set_header Host api.arkham.build;
        proxy_set_header Connection "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Cache-Control;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @build_api_unavailable;
        proxy_cache arkham_build_api;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Arkham-Build-Cache $upstream_cache_status always;
    }

    location @build_api_unavailable {
        default_type application/json;
        return 503 '{"message":"Recommendation service temporarily unavailable"}';
    }

    location ~* ^/assets/.*\.(js|css)$ {
        proxy_pass http://127.0.0.1:39180;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Cache-Control "no-cache" always;
    }

    location ~* ^/(assets|img|fonts|cards)/ {
        proxy_pass http://127.0.0.1:39180;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:39180;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $arkham_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
