server {
    listen 39000 ssl http2;
    listen [::]:39000 ssl http2;
    server_name unkai-server.cloud www.unkai-server.cloud;

    ssl_certificate /etc/letsencrypt/live/unkai-server.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unkai-server.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 5m;
    error_page 497 =301 https://$host:$server_port$request_uri;

    location = /favicon.ico {
        alias /var/www/unkai-portal/favicons/unkai.svg;
        types { image/svg+xml ico; }
        add_header Cache-Control "public, max-age=86400";
    }

    location = /v2 {
        return 301 /;
    }

    location ^~ /v2/ {
        rewrite ^/v2/(.*)$ /$1 permanent;
    }

    location ~* ^/assets/.*\.(js|css)$ {
        proxy_pass http://127.0.0.1:39180;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_cache off;
        add_header Cache-Control "no-cache" always;
    }

    location ~* ^/(assets|img|fonts)/ {
        proxy_pass http://127.0.0.1:39180;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_cache arkham_static;
        proxy_cache_valid 200 301 302 30d;
        proxy_cache_valid 404 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Arkham-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass http://127.0.0.1:39180;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
